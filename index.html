  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #08111e; color: #e6edf7; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button, input, textarea { font: inherit; }
  button { background: #1b2a42; color: #e6edf7; border: 1px solid #2b3e5e; border-radius: 6px; padding: 7px 10px; cursor: pointer; text-align: left; }
  button:hover { background: #24375a; }
  button.on { background: #3a6ea5; border-color: #3a6ea5; }
  button.primary { background: #3a6ea5; border-color: #3a6ea5; text-align: center; }
  button:disabled { opacity: .45; cursor: default; }
  input, textarea { background: #08111e; color: #e6edf7; border: 1px solid #2b3e5e; border-radius: 6px; padding: 7px 9px; width: 100%; }
  textarea { min-height: 60px; resize: vertical; }
  .hidden { display: none !important; }
  .muted { color: #8393ad; font-size: 12px; }
  .bad { color: #ff7b8a; font-size: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }
  .card { background: #101a2c; border: 1px solid #1f2d44; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .stack { display: grid; gap: 8px; }
  img.logo { max-height: 26px; max-width: 90px; vertical-align: middle; }

  #layout { display: grid; grid-template-columns: 230px 1fr 310px; height: 100%; }
  #left { background: #101a2c; border-right: 1px solid #1f2d44; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  #left h1 { font-size: 15px; margin: 0 0 4px; }
  .navgrp { display: grid; gap: 6px; }
  .zoomrow { display: flex; gap: 6px; }
  .zoomrow button { flex: 1; text-align: center; }
  #langWrap { position: relative; }
  #langBtn { width: 100%; }
  #langList { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; max-height: 240px; overflow-y: auto; background: #101a2c; border: 1px solid #2b3e5e; border-radius: 8px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #langList div { padding: 7px 10px; cursor: pointer; }
  #langList div:hover { background: #24375a; }
  #langList div.on { color: #7fb2e8; }

  main { position: relative; min-width: 0; }
  #globe { position: absolute; top: 0; bottom: 0; left: 0; right: 120px; }
  #flat { position: absolute; inset: 0; background: #0c2a47; }
  .panel { position: absolute; inset: 0; overflow-y: auto; padding: 24px; background: #08111e; }
  .panel .inner { max-width: 820px; margin: 0 auto; }
  .panel h2 { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #1f2d44; }
  ol li, ul li { margin: 6px 0; }

  #side { background: #101a2c; border-left: 1px solid #1f2d44; padding: 14px; overflow-y: auto; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1b2a42; border: 1px solid #2b3e5e; padding: 10px 16px; border-radius: 8px; z-index: 9998; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  #modal .box { background: #101a2c; border: 1px solid #2b3e5e; border-radius: 10px; padding: 20px; max-width: 460px; width: 92%; max-height: 90vh; overflow-y: auto; }
  #modal h3 { margin: 0 0 12px; }
</style>
</head>

    <div class="zoomrow">

      <button id="zout" data-i18n="zoomOut"></button>
    </div>
    <div id="langWrap">
      <button id="langBtn"></button>
      <div id="langList" class="hidden"></div>
    </div>
    <div class="muted" id="status"></div>

</div>

// ============ сетка: клетки 3° × 3° ============
const CELL = 3;
const NR = 60, NC = 120;             // широта × долгота
const W = 4320, H = 2160;            // текстура: 36 px на клетку
const PXC = W / NC, PXR = H / NR;
const idxOf = (lat, lon) => {
  const r = Math.min(NR - 1, Math.max(0, Math.floor((90 - lat) / CELL)));
  const c = Math.min(NC - 1, Math.max(0, Math.floor((lon + 180) / CELL)));
  return r * NC + c;
};
const centerOf = i => ({ lat: 90 - (Math.floor(i / NC) + 0.5) * CELL, lon: -180 + ((i % NC) + 0.5) * CELL });
const coordsText = i => { const c = centerOf(i); return `${c.lat.toFixed(1)}°, ${c.lon.toFixed(1)}°`; };
const HUBS = [
  { lat:55.75, lon:37.62, w:1 }, { lat:40.7, lon:-74, w:1 }, { lat:51.5, lon:-0.12, w:0.9 }, { lat:48.85, lon:2.35, w:0.9 },
  { lat:35.7, lon:139.7, w:0.9 }, { lat:39.9, lon:116.4, w:0.8 }, { lat:28.6, lon:77.2, w:0.7 }, { lat:25.2, lon:55.3, w:0.6 },
  { lat:-23.5, lon:-46.6, w:0.6 }, { lat:-33.9, lon:151.2, w:0.5 }, { lat:30, lon:31.2, w:0.4 }, { lat:59.44, lon:24.75, w:0.2 }
];
const PALETTE = ['#ef476f','#06d6a0','#118ab2','#ffd166','#f78c6b','#9b5de5','#00bbf9','#f15bb5'];
const hav = (a, b, c, d) => {
  const R = 6371, rad = Math.PI / 180, dLat = (c - a) * rad, dLon = (d - b) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a * rad) * Math.cos(c * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
};
function demand(c) {
  let s = 0;
  for (const h of HUBS) s += h.w * Math.max(0, 1 - hav(c.lat, c.lon, h.lat, h.lon) / 3500);
  return Math.min(1, s);
}
const cellBase = i => Math.round(10 + 190 * demand(centerOf(i)));
const colorFor = name => { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const neighbors = i => {
  const r = Math.floor(i / NC), c = i % NC, out = [];
  if (r > 0) out.push((r - 1) * NC + c);
  if (r < NR - 1) out.push((r + 1) * NC + c);
  out.push(r * NC + (c + 1) % NC, r * NC + (c - 1 + NC) % NC);
  return out;
};

// ============ суша и море ============
// landArr: 0 — море, 1 — целиком суша (продаётся), 2 — береговая полоса (только вместе с соседом)
let landArr = new Uint8Array(NR * NC);
let baseCanvas = null, landPath = null;

// Рисует контуры суши. Долготы «разворачиваются», чтобы полигоны, пересекающие линию 180°
// (Чукотка, Фиджи, Аляска), не рвались через всю карту. Каждый контур рисуется со сдвигом
// на −360°, 0 и +360°, а лишнее обрезается границами холста.
function drawLandPath(ctx, features) {
  const isPath = !(ctx instanceof CanvasRenderingContext2D);
  if (!isPath) ctx.beginPath();
  const px = lon => (lon + 180) / 360 * W, py = lat => (90 - lat) / 180 * H;
  const addRing = ring => {
    const pts = [];
    let off = 0, prev = null;
    for (const [lon, lat] of ring) {
      if (prev !== null) {
        const d = lon - prev;
        if (d > 180) off -= 360; else if (d < -180) off += 360;
      }
      pts.push([lon + off, lat]);
      prev = lon;
    }
    for (const sh of [-360, 0, 360]) {
      pts.forEach(([lon, lat], k) => {
        const x = px(lon + sh), y = py(lat);
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
    }
  };
  for (const f of features) {
    const g = f.geometry; if (!g) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    for (const poly of polys) for (const ring of poly) addRing(ring);
  }
}

function buildLand(features) {
  const mc = document.createElement('canvas'); mc.width = W; mc.height = H;
  const mctx = mc.getContext('2d');
  mctx.fillStyle = '#000'; mctx.fillRect(0, 0, W, H);
  mctx.fillStyle = '#fff'; drawLandPath(mctx, features); mctx.fill();
  const data = mctx.getImageData(0, 0, W, H).data;
  const mk = new Uint8Array(W * H);
  for (let p = 0; p < W * H; p++) mk[p] = data[p * 4] > 128 ? 1 : 0;

  for (let r = 0; r < NR; r++) for (let c = 0; c < NC; c++) {
    let land = 0;
    for (let sy = 0; sy < 8; sy++) for (let sx = 0; sx < 8; sx++) {
      const x = Math.floor(c * PXC + (sx + 0.5) * PXC / 8);
      const y = Math.floor(r * PXR + (sy + 0.5) * PXR / 8);
      if (mk[y * W + x]) land++;
    }
    landArr[r * NC + c] = land === 64 ? 1 : (land > 0 ? 2 : 0);
  }

  // маленькие острова, помещающиеся в одну клетку, продаются клеткой
  const visited = new Uint8Array(W * H);
  const stack = new Int32Array(W * H);
  for (let p = 0; p < W * H; p++) {
    if (!mk[p] || visited[p]) continue;
    let sp = 0, minX = W, maxX = 0, minY = H, maxY = 0;
    stack[sp++] = p; visited[p] = 1;
    while (sp > 0) {
      const q = stack[--sp];
      const x = q % W, y = (q - x) / W;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const n = ny * W + nx;
        if (mk[n] && !visited[n]) { visited[n] = 1; stack[sp++] = n; }
      }
    }
    const c1 = Math.floor(minX / PXC), c2 = Math.floor(maxX / PXC);
    const r1 = Math.floor(minY / PXR), r2 = Math.floor(maxY / PXR);
    if (c1 === c2 && r1 === r2) landArr[r1 * NC + c1] = 1;
  }

  landPath = new Path2D();
  drawLandPath(landPath, features);

  baseCanvas = document.createElement('canvas'); baseCanvas.width = W; baseCanvas.height = H;
  const b = baseCanvas.getContext('2d');
  b.fillStyle = '#0c2a47'; b.fillRect(0, 0, W, H);
  drawLandPath(b, features);
  b.fillStyle = '#243f58'; b.fill('nonzero');
  b.strokeStyle = '#3d6283'; b.lineWidth = 1.5; b.stroke();
  b.save();
  b.clip(landPath);
  b.strokeStyle = 'rgba(140,190,235,0.14)'; b.lineWidth = 1;
  b.beginPath();
  for (let c = 0; c <= NC; c++) { const x = c * PXC; b.moveTo(x, 0); b.lineTo(x, H); }
  for (let r = 0; r <= NR; r++) { const y = r * PXR; b.moveTo(0, y); b.lineTo(W, y); }
  b.stroke();
  b.restore();
}

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch !== '\r') cur += ch;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
const normStatus = s => {
  s = (s || '').trim().toLowerCase();
  if (['taken', 'занято', 'sold'].includes(s)) return 'taken';
  if (['request', 'заявка', 'reserved', 'резерв'].includes(s)) return 'request';
  return 'free';
};
function parseSheet(text) {
  const rows = parseCSV(text).filter(r => r.length > 1);
  if (!rows.length) return {};
  const head = rows.shift().map(h => h.trim().toLowerCase());
  const out = {};
  for (const r of rows) {
    const o = {};
    head.forEach((h, k) => o[h] = (r[k] || '').trim());
    const id = parseInt(o.cell_id, 10);
    if (isNaN(id) || id < 0 || id >= NR * NC) continue;
    const st = normStatus(o.status);
    if (st === 'free') continue;
    const until = o.reserved_until ? Date.parse(o.reserved_until) : NaN;
    if (st === 'request' && !isNaN(until) && until < Date.now()) continue; // резерв истёк
    out[id] = {
      status: st, brand: o.brand || '—', logo: o.logo_url || '', color: o.color || '',
      price: o.price ? Number(o.price) : null, until: o.reserved_until || ''
    };
  }
  return out;
}

const texCanvas = document.createElement('canvas'); texCanvas.width = W; texCanvas.height = H;
let texTimer = null, prevUrl = null, overlay = null, globe = null, flatMap = null;

function scheduleTexture() { clearTimeout(texTimer); texTimer = setTimeout(renderTexture, 60); }

function ownerMap() {
  const own = new Map();
  for (const k in cells) if (cells[k].status === 'taken') own.set(+k, 'b|' + cells[k].brand);
  for (let i = 0; i < NR * NC; i++) {
    if (landArr[i] !== 2 || own.has(i)) continue;
    for (const n of neighbors(i)) if (own.has(n) && landArr[n] === 1) { own.set(i, own.get(n)); break; }
  }
  return own;
}
function groupsOf(own) {
  const groups = new Map(), seen = new Set();
  for (const [start, key] of own) {
    if (seen.has(start)) continue;
    const g = []; const stack = [start]; seen.add(start);
    while (stack.length) {
      const i = stack.pop(); g.push(i);
      for (const n of neighbors(i)) if (!seen.has(n) && own.get(n) === key) { seen.add(n); stack.push(n); }
    }
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(g);
  }
  return groups;
}

function renderTexture() {
  if (!baseCanvas) return;
  const ctx = texCanvas.getContext('2d');
  ctx.drawImage(baseCanvas, 0, 0);
  const cw = PXC, ch = PXR;

  for (const [, groups] of groupsOf(ownerMap())) {
    for (const g of groups) {
      const rec = g.map(i => cells[i]).find(Boolean);
      if (!rec) continue;
      let r1 = NR, r2 = 0, c1 = NC, c2 = 0;
      for (const i of g) {
        const r = Math.floor(i / NC), c = i % NC;
        r1 = Math.min(r1, r); r2 = Math.max(r2, r); c1 = Math.min(c1, c); c2 = Math.max(c2, c);
      }
      const bx = c1 * cw, by = r1 * ch, bw = (c2 - c1 + 1) * cw, bh = (r2 - r1 + 1) * ch;
      ctx.save();
      ctx.beginPath();
      for (const i of g) ctx.rect((i % NC) * cw, Math.floor(i / NC) * ch, cw, ch);
      ctx.clip();
      ctx.clip(landPath);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = rec.color || colorFor(rec.brand);
      ctx.fillRect(bx, by, bw, bh);
      const img = getLogo(rec.logo);
      if (img) {
        ctx.globalAlpha = 1;
        const iw = img.naturalWidth || 512, ih = img.naturalHeight || 512;
        const s = Math.max(bw / iw, bh / ih);   // cover: логотип полностью закрывает блок
        const dw = iw * s, dh = ih * s;
        ctx.drawImage(img, bx + (bw - dw) / 2, by + (bh - dh) / 2, dw, dh);
      }
      ctx.restore();
    }
  }

  // заявки (резерв): янтарная штриховка
  ctx.save();
  ctx.clip(landPath);
  for (const k in cells) {
    if (cells[k].status !== 'request') continue;
    const i = +k, r = Math.floor(i / NC), c = i % NC;
    ctx.globalAlpha = 0.45; ctx.fillStyle = '#ffb703';
    ctx.fillRect(c * cw, r * ch, cw, ch);
    ctx.globalAlpha = 0.8; ctx.strokeStyle = '#3b2a12'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let d = -ch; d < cw; d += 12) { ctx.moveTo(c * cw + d, r * ch + ch); ctx.lineTo(c * cw + d + ch, r * ch); }
    ctx.stroke();
  }
  // выбранные участки
  for (const i of selected) {
    const r = Math.floor(i / NC), c = i % NC;
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#ffffff';
    ctx.fillRect(c * cw, r * ch, cw, ch);
    ctx.globalAlpha = 1; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.strokeRect(c * cw + 1.5, r * ch + 1.5, cw - 3, ch - 3);
  }
  ctx.restore();

  texCanvas.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    if (globe) globe.globeImageUrl(url);
    if (overlay) overlay.setUrl(url);
    if (prevUrl) { const old = prevUrl; setTimeout(() => URL.revokeObjectURL(old), 3000); }
    prevUrl = url;
  }, 'image/png');
}

// ============ карты ============
function sizeGlobe() {
  if (!globe) return;
  const el = document.getElementById('globe');
  globe.width(el.clientWidth).height(el.clientHeight);
}
async function initMaps() {
  let features = [];
  try {
    const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')).json();
    features = topojson.feature(topo, topo.objects.countries).features;
  } catch (e) { console.warn('Не удалось загрузить границы стран', e); }
  buildLand(features);

  globe = Globe()(document.getElementById('globe'))
    .backgroundColor('rgba(0,0,0,0)')
    .showAtmosphere(false)
    .showGraticules(false)
    .pointOfView({ lat: 20, lng: 20, altitude: 2.2 }, 0)
    .onGlobeClick(({ lat, lng }) => onPick(idxOf(lat, lng)));
  sizeGlobe();

  flatMap = L.map('flat', {
    crs: L.CRS.EPSG4326, minZoom: 1, maxZoom: 7, zoomControl: false,
    maxBounds: [[-90, -180], [90, 180]], maxBoundsViscosity: 1, worldCopyJump: false
  }).fitBounds([[-90, -180], [90, 180]]);
  overlay = L.imageOverlay(texCanvas.toDataURL('image/png'), [[-90, -180], [90, 180]]).addTo(flatMap);
  flatMap.on('click', e => onPick(idxOf(e.latlng.lat, e.latlng.lng)));

  renderTexture();
  await loadSheet();
  setInterval(loadSheet, CONFIG.REFRESH_MS);
}

// ============ выбор ============
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function onPick(i) {
  if (landArr[i] === 0) return toast(t('water'));
  if (landArr[i] === 2) { focus = i; renderSide(); return toast(t('coastNote')); }
  focus = i;
  if (cells[i]) { renderSide(); return toast(t('takenNote')); }
  if (selected.has(i)) selected.delete(i); else selected.add(i);
  renderSide();
  scheduleTexture();
}

// ============ правая панель ============
function renderSide() {
  const side = document.getElementById('side');
  let html = '';
  if (focus !== null) {
    const rec = cells[focus];
    const st = rec ? rec.status : 'free';
    const label = st === 'taken' ? t('taken') : st === 'request' ? t('request') : t('free');
    html += `<div class="card">
      <div class="row"><b>${t('cell')} #${focus}</b><span class="muted">${coordsText(focus)}</span></div>
      <div class="row"><span class="muted">${t('owner')}</span><span>${rec ? (getLogo(rec.logo) ? `<img class="logo" src="${rec.logo}" alt=""> ` : '') + rec.brand : '—'}</span></div>
      <div class="row"><span class="muted">${label}</span><span>${rec && rec.until && st === 'request' ? rec.until : ''}</span></div>
      <div class="row"><span class="muted">${t('cellPrice')}</span><span>${money(cellPrice(focus))}</span></div>
    </div>`;
  }
  html += `<div class="card"><b>${t('selection')}</b>`;
  if (!selected.size) html += `<div class="muted" style="margin-top:6px">${t('empty')}</div>`;
  else {
    const q = quote([...selected]);
    for (const it of q.items) html += `<div class="row"><span>#${it.id} <span class="muted">${coordsText(it.id)}</span></span><span>${money(it.price)}</span></div>`;
    html += `<div class="row" style="margin-top:8px"><b>${t('total')}</b><b>${money(q.total)}</b></div>`;
  }
  html += `<div class="row" style="margin-top:10px;gap:6px">
    <button class="primary" id="req" ${selected.size ? '' : 'disabled'} style="flex:1">${t('leaveRequest')}</button>
    <button id="clear" ${selected.size ? '' : 'disabled'}>${t('clear')}</button></div></div>`;
  html += `<div class="card"><b>${t('pricing')}</b><div class="muted" style="margin-top:6px">${t('pricingText')}</div></div>`;
  side.innerHTML = html;
  const req = document.getElementById('req');
  if (req) req.onclick = openRequest;
  document.getElementById('clear').onclick = () => { selected.clear(); renderSide(); scheduleTexture(); };
}

// ============ заявка (без аккаунта, письмом владельцу) ============
const BANNED = ['казино','ставк','покер','порно','наркот','политик','партия','выбор','эрот','оружи','casino','poker','porn','drug','politic','election','party','weapon','gambl'];
const BANNED_WORDS = ['bet','gun','sex'];
function normalizeName(s) {
  return s.toLowerCase().replace(/ё/g, 'е')
    .replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/@/g,'a').replace(/\$/g,'s')
    .replace(/[^a-zа-я0-9 ]+/g, ' ');
}
function bannedIn(name) {
  const n = normalizeName(name);
  const compact = n.replace(/\s+/g, '');
  if (BANNED.some(w => compact.includes(w))) return true;
  return BANNED_WORDS.some(w => new RegExp('(^|\\s)' + w + '(\\s|$)').test(n));
}
function openModal(html) {
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function openRequest() {
  if (!selected.size) return toast(t('noSelect'));
  const q = quote([...selected]);
  openModal(`<h3>${t('reqTitle')}</h3>
    <div class="stack">
      <input id="rbrand" maxlength="60" placeholder="${t('reqBrand')}">
      <div id="rbanned" class="bad hidden">${t('bannedName')}</div>
      <input id="remail" type="email" placeholder="${t('reqEmail')}">
      <input id="rlogo" placeholder="${t('reqLogo')}">
      <textarea id="rcomment" placeholder="${t('reqComment')}"></textarea>
      <div class="muted">${selected.size} × · ${t('total')}: <b>${money(q.total)}</b></div>
      <label class="muted"><input type="checkbox" id="ragree" style="width:auto"> ${t('agree')}</label>
      <div class="muted">${t('reqNote')}</div>
      <div class="row" style="justify-content:flex-end">
        <button id="rcancel">${t('cancel')}</button>
        <button class="primary" id="rsend" disabled>${t('reqSend')}</button>
      </div>
    </div>`);
  const brandIn = document.getElementById('rbrand'), banned = document.getElementById('rbanned');
  const agree = document.getElementById('ragree'), send = document.getElementById('rsend');
  const check = () => {
    const bad = bannedIn(brandIn.value);
    banned.classList.toggle('hidden', !bad);
    send.disabled = bad || !agree.checked || !brandIn.value.trim();
  };
  brandIn.oninput = check; agree.onchange = check;
  document.getElementById('rcancel').onclick = closeModal;
  send.onclick = () => {
    const brand = brandIn.value.trim();
    const email = document.getElementById('remail').value.trim();
    const logo = document.getElementById('rlogo').value.trim();
    const comment = document.getElementById('rcomment').value.trim();
    if (bannedIn(brand)) return toast(t('bannedName'));
    if (!/^\S+@\S+\.\S+$/.test(email)) return toast(t('emailBad'));
    const lines = [...selected].sort((a, b) => a - b).map(i => `#${i} (${coordsText(i)}) — ${money(cellPrice(i))}`);
    const body = [
      `Brand: ${brand}`, `Reply email: ${email}`, `Logo: ${logo || 'will send separately'}`,
      `Cells:`, ...lines, `Total: ${money(q.total)}`, comment ? `Comment: ${comment}` : ''
    ].filter(Boolean).join('\n');
    const subject = `Placement request: ${brand}`;
    const mailto = `mailto:${CONFIG.OWNER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    const u = MAILUI[lang] || MAILUI.en;
    // Показываем адрес и текст заявки: работает без настроенной почтовой программы
    openModal(`<h3>${u.title}</h3>
      <p>${u.intro}</p>
      <div class="row"><b>${CONFIG.OWNER_EMAIL}</b><button id="mcopy">${u.copy}</button></div>
      <div class="row"><span class="muted">${u.subject}</span><button id="mcopy2">${u.copy}</button></div>
      <textarea id="mtext" readonly style="min-height:160px">${subject}\n\n${body}</textarea>
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
        <a href="${mailto}" style="color:#7fb2e8">${u.openMail}</a>
        <button class="primary" id="mdone">${u.done}</button>
      </div>`);
    const flash = (btn) => { const old = btn.textContent; btn.textContent = u.copied; setTimeout(() => btn.textContent = old, 1500); };
    const copy = (text, btn) => {
      const fallback = () => { const ta = document.getElementById('mtext'); ta.select(); document.execCommand('copy'); flash(btn); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => flash(btn), fallback); else fallback();
    };
    document.getElementById('mcopy').onclick = e => copy(CONFIG.OWNER_EMAIL, e.target);
    document.getElementById('mcopy2').onclick = e => copy(document.getElementById('mtext').value, e.target);
    document.getElementById('mdone').onclick = () => { closeModal(); selected.clear(); renderSide(); scheduleTexture(); toast(t('reqSent')); };
  };
}

// ============ о сайте, рейтинг, правила ============
function renderAbout() {
  document.querySelector('#about .inner').innerHTML = `
    <h2>${t('aboutTitle')}</h2>
    <p>${t('aboutText')}</p>
    <div class="card"><b>${t('aboutStepsTitle')}</b><ol>${arr('aboutSteps').map(s => `<li>${s}</li>`).join('')}</ol></div>
    <p class="muted">${t('aboutPricing')}</p>
    <div class="row" style="margin-top:14px;gap:8px">
      <button class="primary" data-go="globe">${t('navGlobe')}</button>
      <button class="primary" data-go="flat">${t('navMap')}</button>
    </div>`;
  document.querySelectorAll('#about [data-go]').forEach(b => b.onclick = () => setView(b.dataset.go));
}
function renderRank() {
  const byBrand = {};
  for (const k in cells) {
    const c = cells[k];
    if (c.status !== 'taken') continue;
    byBrand[c.brand] = byBrand[c.brand] || { brand: c.brand, logo: c.logo, cells: 0, value: 0 };
    byBrand[c.brand].cells++;
    byBrand[c.brand].value += cellPrice(+k);
  }
  const rows = Object.values(byBrand).sort((a, b) => b.cells - a.cells || b.value - a.value);
  document.querySelector('#rank .inner').innerHTML = `<h2>${t('rank')}</h2>
    <table><tr><th>${t('place')}</th><th>${t('brand')}</th><th>${t('cells')}</th><th>${t('valueNow')}</th></tr>
    ${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${getLogo(r.logo) ? `<img class="logo" src="${r.logo}" alt=""> ` : ''}${r.brand}</td><td>${r.cells}</td><td>${money(r.value)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">—</td></tr>'}
    </table>`;
}
function renderRules() {
  document.querySelector('#rules .inner').innerHTML = `<h2>${t('rulesTitle')}</h2>
    <ol>${arr('rulesList').map(r => `<li>${r}</li>`).join('')}</ol>
    <div class="card"><b>${t('pricing')}</b><p class="muted">${t('pricingText')}</p></div>`;
}

// ============ язык и общий рендер ============
const langBtn = document.getElementById('langBtn');
const langList = document.getElementById('langList');
function renderLangs() {
  langBtn.textContent = '🌐 ' + (LANGS.find(l => l[0] === lang) || LANGS[0])[1];
  langList.innerHTML = LANGS.map(([code, name]) => `<div data-code="${code}" class="${code === lang ? 'on' : ''}">${name}</div>`).join('');
  langList.querySelectorAll('div').forEach(d => d.onclick = () => {
    lang = d.dataset.code;
    try { localStorage.setItem('lang', lang); } catch (e) {}
    langList.classList.add('hidden');
    renderAll();
    setStatus(t('statusNote'));
  });
}
langBtn.onclick = e => { e.stopPropagation(); langList.classList.toggle('hidden'); };
document.addEventListener('click', () => langList.classList.add('hidden'));

function applyStatic() {
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.documentElement.lang = lang;
  document.title = t('title');
}
function renderAll() {
  applyStatic();
  renderLangs();
  renderSide();
  renderAbout();
  renderRank();
  renderRules();
}

function setView(v) {
  view = v;
  document.getElementById('globe').classList.toggle('hidden', v !== 'globe');
  document.getElementById('flat').classList.toggle('hidden', v !== 'flat');
  document.getElementById('about').classList.toggle('hidden', v !== 'about');
  document.getElementById('rank').classList.toggle('hidden', v !== 'rank');
  document.getElementById('rules').classList.toggle('hidden', v !== 'rules');
  if (v === 'rank') renderRank();
  applyStatic();
  if (v === 'globe') sizeGlobe();
  if (v === 'flat' && flatMap) setTimeout(() => flatMap.invalidateSize(), 0);
}
function zoomBy(dir) {
  if (view === 'flat' && flatMap) return dir > 0 ? flatMap.zoomIn() : flatMap.zoomOut();
  if (!globe) return;
  const pov = globe.pointOfView();
  const alt = Math.min(4, Math.max(0.15, pov.altitude * (dir > 0 ? 0.7 : 1.4)));
  globe.pointOfView({ altitude: alt }, 350);
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
document.getElementById('zin').onclick = () => zoomBy(1);
document.getElementById('zout').onclick = () => zoomBy(-1);
window.addEventListener('resize', () => { sizeGlobe(); if (flatMap) flatMap.invalidateSize(); });

// ============ старт ============
renderAll();
setView('about');
initMaps().catch(e => console.error(e));
</script>
